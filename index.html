<!DOCTYPE html>
<html lang="ja">
<head>

<!-- PWA Manifest (inlined as a data URL for single-file) -->
<link rel="manifest" href='data:application/json,{"name":"AR%E7%85%A7%E5%BA%A6%E6%B8%AC%E5%AE%9APro","short_name":"LuxAR","start_url":"./","display":"standalone","background_color":"#000000","theme_color":"#0a84ff","icons":[{"src":"data:image/png;base64,iVBORw0KGgo=","sizes":"192x192","type":"image/png"}]}'>

<style>
html,body{
  overscroll-behavior:none;margin:0;padding:0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans JP",sans-serif;background:#000;color:#fff;-webkit-font-smoothing:antialiased}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
#overlay{position:fixed;inset:0;z-index:1;pointer-events:auto;touch-action:none}
#pdfCanvas,#pdfOverlay{position:fixed;inset:0;width:100%;height:100%;background:#111;z-index:0;display:none;touch-action:none}
#pdfOverlay{z-index:2;pointer-events:auto;background:transparent}

#ui{
  position:fixed;left:8px;right:8px;bottom:8px;z-index:10;
  background:rgba(18,18,20,0.82);
  backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  padding:8px;
  box-shadow:0 8px 24px rgba(0,0,0,0.5);
  max-height:48vh;
  display:flex;flex-direction:column;gap:6px;
  font-size:14px;
}
.header{display:flex;gap:6px;align-items:center}
.header input,.header select{
  background:#222;color:#fff;border:1px solid #333;border-radius:10px;
  padding:6px 8px;font-size:13px;min-width:0;
}
.header input{flex:1}
.header select{width:110px}

.toolbar{display:flex;gap:4px;flex-wrap:wrap}
.toolbar button{
  background:#2a2a2e;color:#fff;border:1px solid #3a3a40;
  border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;
  min-width:36px;height:32px;display:flex;align-items:center;justify-content:center;
}
.toolbar button:active{transform:scale(0.97)}
.toolbar button.danger{background:#5c1a1a;border-color:#7a2a2a}
.chip{background:#0a84ff;color:#fff;border-radius:999px;padding:2px 8px;font-size:11px;margin-left:auto;align-self:center}

.measure{display:flex;gap:6px;align-items:center}
.measure input{
  width:80px;background:#1c1c1f;color:#fff;border:1px solid #333;border-radius:10px;
  padding:6px 8px;font-size:14px;text-align:right;
}
.measure span{opacity:0.6}
.diff{margin-left:auto;background:#0a84ff22;color:#7dd3fc;border:1px solid #0a84ff55;border-radius:8px;padding:4px 8px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}

#commentInput{
  width:100%;box-sizing:border-box;background:#1c1c1f;color:#fff;border:1px solid #333;border-radius:10px;
  padding:6px 8px;font-size:13px;
}

details{background:#141418;border:1px solid #26262c;border-radius:12px;padding:4px 6px}
details>summary{cursor:pointer;font-size:12px;opacity:0.85;padding:4px;list-style:none}
details>summary::-webkit-details-marker{display:none}
details[open]>summary{opacity:1;margin-bottom:4px}

.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row button,.row label.file{
  background:#2a2a2e;color:#fff;border:1px solid #3a3a40;border-radius:9px;
  padding:5px 9px;font-size:12px;cursor:pointer;
}
.row input[type=number]{width:70px;background:#1c1c1f;color:#fff;border:1px solid #333;border-radius:8px;padding:5px 6px;font-size:12px}
#pageInfo{min-width:50px;text-align:center;font-size:12px;opacity:0.8}

#points{max-height:18vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.pointCard{
  background:#1a1a1f;border:1px solid #2a2a30;border-radius:10px;padding:6px 8px;font-size:12px;line-height:1.3;
}
.pointCard b{font-size:13px}
.pointCard .badge{display:inline-block;background:#333;color:#ddd;border-radius:6px;padding:1px 6px;font-size:10px;margin-left:6px}
.pointCard .row{margin-top:4px}
.pointCard button{background:#2c2c32;border:1px solid #3a3a44;padding:3px 6px;font-size:11px;border-radius:6px}

.photoThumb{width:48px;height:48px;object-fit:cover;border-radius:6px;border:1px solid #333}

.hiddenInput{display:none}

/* compact scrollbars */
#points::-webkit-scrollbar{width:6px}
#points::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
</style>

<!-- Camera mode -->
<video id="camera" autoplay playsinline></video>
<canvas id="overlay"></canvas>

<!-- PDF mode -->
<canvas id="pdfCanvas"></canvas>
<canvas id="pdfOverlay"></canvas>


<div id="ui">
  <div class="header">
    <input id="siteName" placeholder="現場名">
    <input id="prefixInput" value="A" style="width:40px" title="接頭語">
    <input id="roomName" placeholder="部屋名">

  <div class="toolbar">
    <button id="addPointBtn" title="点追加">＋</button>
    <button id="undoBtn" title="1つ戻る">↶</button>

  <div class="measure">

  <details>
    <summary>写真・PDF・グリッド</summary>
    <div class="row" style="margin-bottom:4px">
      <button id="captureFromCamBtn">写真撮影</button>
      <label for="photoInput" class="file">写真選択</label>

    </div>
    <div class="row" style="margin-bottom:4px">
      <label for="pdfInput" class="file">PDF読込</label>
      <input type="file" id="pdfInput" accept="application/pdf" class="hiddenInput">
      <button id="savePdfBtn">PDF保存</button>
      <button id="prevPageBtn">◀</button>
      <span id="pageInfo">-/-</span>
      <button id="nextPageBtn">▶</button>
    </div>
    <div class="row" style="margin-bottom:4px">
      <span style="font-size:11px;opacity:0.7">スケール</span>
      <input id="pdfScale" type="number" value="1.5" step="0.1">
      <button id="rerenderBtn">再描画</button>
    </div>
    <div class="row">
      <input id="gridW" type="number" placeholder="幅m">
      <input id="gridD" type="number" placeholder="奥m">

      <input id="gridY" type="number" placeholder="行">
      <button id="genGridBtn">グリッド</button>

  <details open>

    <div id="points"></div>

</div>

<script>
/* ---------------------------
   State and DOM references
----------------------------*/
const video = document.getElementById('camera');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');

const addPointBtn = document.getElementById('addPointBtn');
// offBtn/onBtn removed for realtime
const exportBtn = document.getElementById('exportBtn');
const exportXlsxBtn = document.getElementById('exportXlsxBtn');
const clearBtn = document.getElementById('clearBtn');
const deletePointBtn = document.getElementById('deletePointBtn');
const undoBtn = document.getElementById('undoBtn');

const offLuxInput = document.getElementById('offLuxInput');
const onLuxInput = document.getElementById('onLuxInput');
const diffDisplay = document.getElementById('diffDisplay');
const commentInput = document.getElementById('commentInput');
const pointsDiv = document.getElementById('points');
const countBadge = document.getElementById('countBadge');

const siteName = document.getElementById('siteName');
const roomName = document.getElementById('roomName');

const modeSelect = document.getElementById('modeSelect');
const captureFromCamBtn = document.getElementById('captureFromCamBtn');
const photoInput = document.getElementById('photoInput');

/* PDF elements */
const pdfInput = document.getElementById('pdfInput');
const savePdfBtn = document.getElementById('savePdfBtn');
const pdfCanvas = document.getElementById('pdfCanvas');
const pdfCtx = pdfCanvas.getContext('2d');
const pdfOverlay = document.getElementById('pdfOverlay');
const pdfOverlayCtx = pdfOverlay.getContext('2d');
const prevPageBtn = document.getElementById('prevPageBtn');
const nextPageBtn = document.getElementById('nextPageBtn');
const pageInfo = document.getElementById('pageInfo');
const pdfScaleInput = document.getElementById('pdfScale');
const rerenderBtn = document.getElementById('rerenderBtn');

/* Data */
let points = []; // shared between modes

const bleBtn = document.getElementById('bleBtn');
const bleStatus = document.getElementById('bleStatus');
let bleDevice=null, bleChar=null, bleMode='off';
bleBtn.onclick = async ()=>{
  try{
    bleDevice = await navigator.bluetooth.requestDevice({
      filters:[{services:[0x181A]}],
      optionalServices:[0x181A]
    });
    bleStatus.textContent='接続中...';
    const server = await bleDevice.gatt.connect();
    const service = await server.getPrimaryService(0x181A);
    bleChar = await service.getCharacteristic(0x2A77); // Illuminance
    await bleChar.startNotifications();
    bleChar.addEventListener('characteristicvaluechanged', e=>{
      let v = 0;
      try{
        if(e.target.value.byteLength >= 4){
          v = e.target.value.getUint32(0,true)/100;
        }else{
          v = e.target.value.getUint16(0,true)/100;
        }
      }catch(err){
        console.warn(err);
        return;
      }
      if(!selectedPoint){ bleStatus.textContent=`${v}lx (未選択)`; return; }
      if(bleMode==='off'){
        offLuxInput.value = v.toFixed(1);
        selectedPoint.offLux = v;
        bleMode='on';
        bleStatus.textContent=`消灯 ${v}lx 取得`;
      }else{
        onLuxInput.value = v.toFixed(1);
        selectedPoint.onLux = v;
        selectedPoint.diff = v - (selectedPoint.offLux||0);
        bleMode='off';
        bleStatus.textContent=`点灯 ${v}lx 差${selectedPoint.diff.toFixed(1)}`;
      }
      handleLuxInput();
    });
    bleStatus.textContent='接続済';
  }catch(err){ bleStatus.textContent='失敗'; console.warn(err); }
};

let selectedPoint = null;

/* Camera */
let cameraStream = null;

/* PDF */
let loadedPdfBytes = null;
let pdfDoc = null;
let currentPage = 1;
let totalPages = 0;
let pdfScale = 1.5;

/* ---------------------------
   Utilities
----------------------------*/
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (modeSelect.value === 'camera') {
    // overlay redraw is done in draw()
  }
}
window.addEventListener('resize', resize);

let pointCounter = 1;
function uid(prefix=null) {
  const pre = prefix || document.getElementById('prefixInput')?.value || 'P';
  return `${pre}-${pointCounter++}`;
}

function now() {
  const d = new Date();
  return d.toLocaleString();
}


// IndexedDB for photos and large data
let db;
const dbReq = indexedDB.open('luxDB',1);
dbReq.onupgradeneeded = e=>{ db = e.target.result; db.createObjectStore('state'); };
dbReq.onsuccess = e=>{ db = e.target.result; };

('lux_ar_state', JSON.stringify(data));
    if(db){
      const tx = db.transaction('state','readwrite');
      tx.objectStore('state').put(data,'main');
    }
  } catch(e){}
}
function loadState() {
  try {
    const raw = localStorage.getItem('lux_ar_state');
    if (raw) {
      const data = JSON.parse(raw);
      siteName.value = data.siteName || '';
      roomName.value = data.roomName || '';
      points = Array.isArray(data.points) ? data.points : [];
    }
    if(db){
      const tx = db.transaction('state','readonly');
      const req = tx.objectStore('state').get('main');
      req.onsuccess = ()=>{
        if(req.result){
          siteName.value = req.result.siteName || siteName.value;
          roomName.value = req.result.roomName || roomName.value;
          points = req.result.points || points;
          renderPoints(); updateCount();
        }
      };
    }
  } catch(e){}
}

function updateCount() {
  countBadge.textContent = `${points.length} 点`;
}

function updateDiffDisplay() {
  if (!selectedPoint) { diffDisplay.textContent = '差分: - lx'; return; }
  const off = selectedPoint.offLux;
  const on = selectedPoint.onLux;
  if (off != null && on != null) {
    selectedPoint.diff = on - off;
    diffDisplay.textContent = `差分: ${selectedPoint.diff} lx (計算式: 点灯 - 消灯 = ${on} - ${off})`;
  } else {
    diffDisplay.textContent = '差分: - lx';
  }
}




function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // draw points as AR overlays
  points.forEach((p, index) => {
    if (p.mode === 'pdf' && modeSelect.value === 'camera') {
      // don't draw pdf-only points over camera; allow only camera-mode points
      return;
    }
    if (modeSelect.value === 'camera' && p.mode !== 'pdf') {
      // For camera points, use their stored screen x,y
      const rect = canvas.getBoundingClientRect();
      const x = p.rx!=null ? p.rx*rect.width : (p.x ?? canvas.width/2);
      const y = p.ry!=null ? p.ry*rect.height : (p.y ?? canvas.height/2);
      ctx.beginPath();
      ctx.arc(x, y, 16, 0, Math.PI * 2);
      ctx.fillStyle = (selectedPoint && selectedPoint.id === p.id) ? '#00d1ff' : 'red';
      ctx.fill();

      ctx.fillStyle = 'white';
      ctx.font = '20px sans-serif';
      const diffText = p.diff != null ? `${p.diff} lx` : '-';
    const target = parseFloat(document.getElementById('targetLux')?.value);
    const pass = (p.diff != null && !isNaN(target)) ? (p.diff >= target) : null;
    const passIcon = pass===null ? '' : (pass ? '🟢' : '🔴');
      ctx.fillText(`${p.id} ${diffText}`, x + 20, y);
    }
  });
  requestAnimationFrame(draw);
}

/* ---------------------------
   Point management
----------------------------*/
function addPointAt(x, y, mode='camera', page=currentPage) {
  const rect = mode==='pdf' ? pdfOverlay.getBoundingClientRect() : canvas.getBoundingClientRect();
  const rx = x / rect.width;
  const ry = y / rect.height;
  const point = {
    id: uid(),
    x, y, rx, ry,
    mode,          // 'camera' or 'pdf'
    page,          // pdf page index (1-based)
    offLux: null,
    onLux: null,
    diff: null,
    photo: null,   // dataURL
    time: null,
    comment: ''
  };
  points.push(point);
  selectedPoint = point;
  renderPoints();
  updateCount();
  saveState();
  return point;
}

function setSelected(p) {
  selectedPoint = p;
  if (p) {
    offLuxInput.value = p.offLux != null ? p.offLux : '';
    onLuxInput.value = p.onLux != null ? p.onLux : '';
    commentInput.value = p.comment || '';
    updateDiffDisplay();
  } else {
    offLuxInput.value = '';
    onLuxInput.value = '';
    commentInput.value = '';
    updateDiffDisplay();
  }
  renderPoints(); // to reflect selection UI
}

function renderPoints() {
  pointsDiv.innerHTML = '';
  const activePage = currentPage;

  points.forEach((p) => {
    // Filter: in pdf mode, show all points but visually hint different pages
    const onOtherPdfPage = (modeSelect.value === 'pdf' && p.mode === 'pdf' && p.page !== activePage);

    const div = document.createElement('div');
    div.className = 'pointCard';

    const diffText = p.diff != null ? `${p.diff} lx` : '-';
    const target = parseFloat(document.getElementById('targetLux')?.value);
    const pass = (p.diff != null && !isNaN(target)) ? (p.diff >= target) : null;
    const passIcon = pass===null ? '' : (pass ? '🟢' : '🔴');
    const offText = p.offLux != null ? `${p.offLux}` : '-';
    const onText  = p.onLux  != null ? `${p.onLux}` : '-';

    const modeLabel = p.mode === 'pdf' ? `PDF p.${p.page}` : 'Camera';
    const isSelected = selectedPoint && selectedPoint.id === p.id;

    div.style.outline = isSelected ? '2px solid #00d1ff' : 'none';
    div.style.opacity = onOtherPdfPage ? 0.6 : 1;

    div.innerHTML = `
      <div class="row" style="justify-content:space-between;align-items:center;">
        <b>${p.id}</b>
        <span class="badge">${modeLabel}</span>
      </div>
      消灯: ${offText} lx　点灯: ${onText} lx　差分: ${diffText} ${passIcon}<br>
      <small style="opacity:0.8">計算式（点灯 - 消灯）: ${onText} - ${offText} = ${p.diff != null ? p.diff : '-'}</small><br>
      ${p.time ? p.time : ''}<br>
      ${p.comment ? ('コメント: ' + escapeHtml(p.comment)) : ''}
      <div class="row" style="margin-top:8px;align-items:center;">
        ${p.photo ? `<img class="photoThumb" src="${p.photo}" alt="photo">` : ''}
        <button class="secondary" data-act="select">選択</button>
        <button class="secondary" data-act="center">中央へ</button>
        <button class="secondary" data-act="delete">削除</button>
      </div>
    `;

    div.addEventListener('click', (e) => {
      const act = e.target.getAttribute('data-act');
      if (!act) { setSelected(p); return; }
      e.stopPropagation();
      if (act === 'select') {
        setSelected(p);
      } else if (act === 'center') {
        if (p.mode === 'camera') {
          p.x = canvas.width/2;
          p.y = canvas.height/2;
        } else {
          const rect = pdfOverlay.getBoundingClientRect();
          p.x = rect.width/2;
          p.y = rect.height/2;
        }
        renderPoints();
        if (modeSelect.value === 'pdf') redrawPdfPoints();
        saveState();
      } else if (act === 'delete') {
        points = points.filter(pt => pt.id !== p.id);
        if (selectedPoint && selectedPoint.id === p.id) selectedPoint = null;
        renderPoints();
        if (modeSelect.value === 'pdf') redrawPdfPoints();
        updateCount();
        saveState();
      }
    });

    pointsDiv.appendChild(div);
  });
}

function escapeHtml(s=''){
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------------------------
   Camera photo capture
----------------------------*/
async function capturePhotoFromVideo() {
  if (!video.videoWidth || !video.videoHeight) return null;
  const temp = document.createElement('canvas');
  temp.width = video.videoWidth;
  temp.height = video.videoHeight;
  const tctx = temp.getContext('2d');
  const MAX=1280;
  let w = video.videoWidth, h = video.videoHeight;
  if(w>MAX){ h = h*MAX/w; w=MAX; }
  if(h>MAX){ w = w*MAX/h; h=MAX; }
  temp.width=w; temp.height=h;
  tctx.drawImage(video, 0, 0, w, h);
  return temp.toDataURL('image/jpeg', 0.8);
}

/* ---------------------------
   CSV Export
----------------------------*/
function exportCsv() {
  const header = [
    '現場名','部屋名','点番号','モード','ページ','消灯(lx)','点灯(lx)','差分(lx)','時刻','コメント'
  ];
  const rows = points.map(p => [
    siteName.value || '',
    roomName.value || '',
    p.id,
    p.mode,
    p.mode === 'pdf' ? p.page : '',
    p.offLux ?? '',
    p.onLux ?? '',
    p.diff ?? '',
    p.time ?? '',
    (p.comment || '').replace(/[\r\n,]/g,' ')
  ]);
  const csv = [header, ...rows].map(r => r.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `lux_measurement_${formatDateForFile(new Date())}.csv`;
  a.click();
}
function formatDateForFile(d){
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}

/* ---------------------------
   PDF Rendering and Markup
----------------------------*/
pdfjsLib.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js`;

pdfInput.onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  loadedPdfBytes = await file.arrayBuffer();
  const loadingTask = pdfjsLib.getDocument({ data: loadedPdfBytes });
  pdfDoc = await loadingTask.promise;
  currentPage = 1;
  totalPages = pdfDoc.numPages || 1;
  pageInfo.textContent = `${currentPage}/${totalPages}`;
  await renderPdfPage(currentPage);
  switchToPdfMode();
};

async function renderPdfPage(pageNum) {
  if (!pdfDoc) return;
  const page = await pdfDoc.getPage(pageNum);
  pdfScale = parseFloat(pdfScaleInput.value || '1.5') || 1.5;
  const viewport = page.getViewport({ scale: pdfScale });

  // match canvas pixels to device pixels
  const dpr = window.devicePixelRatio || 1;
  pdfCanvas.width = Math.floor(viewport.width * dpr);
  pdfCanvas.height = Math.floor(viewport.height * dpr);
  pdfCanvas.style.width = `${viewport.width}px`;
  pdfCanvas.style.height = `${viewport.height}px`;
  pdfOverlay.width = pdfCanvas.width;
  pdfOverlay.height = pdfCanvas.height;
  pdfOverlay.style.width = pdfCanvas.style.width;
  pdfOverlay.style.height = pdfCanvas.style.height;

  const renderContext = {
    canvasContext: pdfCtx,
    viewport: viewport,
    transform: [dpr, 0, 0, dpr, 0, 0]
  };
  await page.render(renderContext).promise;

  redrawPdfPoints();
  pageInfo.textContent = `${currentPage}/${totalPages}`;
}

function canvasCssToPdfPixel(xCss, yCss) {
  const rect = pdfOverlay.getBoundingClientRect();
  const cssW = rect.width, cssH = rect.height;
  const dpr = window.devicePixelRatio || 1;
  // pdfCanvas.width/height are in device pixels already
  const xPx = (xCss / cssW) * pdfCanvas.width;
  const yPx = (yCss / cssH) * pdfCanvas.height;
  return { x: xPx, y: yPx };
}
function pdfPixelToCanvasCss(xPx, yPx) {
  const rect = pdfOverlay.getBoundingClientRect();
  const cssW = rect.width, cssH = rect.height;
  const xCss = (xPx / pdfCanvas.width) * cssW;
  const yCss = (yPx / pdfCanvas.height) * cssH;
  return { x: xCss, y: yCss };
}

function redrawPdfPoints() {
  if (!pdfDoc) return;
  // clear overlay
  pdfOverlayCtx.clearRect(0,0,pdfOverlay.width,pdfOverlay.height);
  // Redraw page image already rendered; just draw annotations on top
  // So we need to overlay using same pdfCtx
  // Clear overlay? Not needed because we wrote background image.
  // But we need to re-render background when needed; here we only paint points overlay.
  // Draw points for current page only
  const rect = pdfOverlay.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;

  // Create a temporary overlay to not ruin the base raster (optional):
  // We can simply draw over the same context; points will accumulate if we don't re-render page.
  // So re-render page before calling this, or clear and re-render; here assume renderPdfPage called earlier.
  // To make stable, redraw background by re-rendering page when needed (handled in renderPdfPage).

  // Repaint points on top:
  // To avoid smearing after multiple calls, re-render page before this function if needed.

  // For current simple approach, we will re-render page when points change through explicit calls.

  // Draw points
  points.forEach(p => {
    if (p.mode !== 'pdf' || p.page !== currentPage) return;

    const rect = pdfOverlay.getBoundingClientRect();
    const x = p.rx!=null ? p.rx*rect.width : p.x;
    const y = p.ry!=null ? p.ry*rect.height : p.y; // p.x/p.y are stored in CSS coords relative to pdfCanvas element
    const { x: xPx, y: yPx } = canvasCssToPdfPixel(x, y);

    // Convert to canvas pixels coordinates for stroke size
    pdfOverlayCtx.save();
    pdfOverlayCtx.fillStyle = (selectedPoint && selectedPoint.id === p.id) ? '#00d1ff' : 'red';
    // Circle radius in CSS pixels -> convert to device pixels
    const rCss = 14;
    const rPx = rCss * dpr;

    pdfOverlayCtx.beginPath();
    pdfOverlayCtx.arc(xPx, yPx, rPx, 0, Math.PI * 2);
    pdfOverlayCtx.fill();

    // Text
    const label = `${p.id} 差:${p.diff != null ? p.diff : '-'}lx (点${p.onLux??'-'}-消${p.offLux??'-'})`;
    pdfOverlayCtx.fillStyle = 'yellow';
    pdfOverlayCtx.font = `${16 * dpr}px sans-serif`; // 16 CSS px
    pdfOverlayCtx.textBaseline = 'middle';
    pdfOverlayCtx.fillText(label, xPx + 20 * dpr, yPx);
    pdfOverlayCtx.restore();
  });
}

},{passive:false});

    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx,dy);
    const delta = dist / pdfZoom.lastDist;
    pdfZoom.lastDist = dist;

next = Math.max(0.5, Math.min(5, next));

/* Save completed PDF with embedded text for diff and optional photo thumbs */

let jpFontBytes=null;
async function loadJpFont(){
  if(jpFontBytes) return jpFontBytes;
  const cache = await caches.open('lux-fonts');
  const url = 'https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf';
  let res = await cache.match(url);
  if(!res){
    res = await fetch(url);
    await cache.put(url, res.clone());
  }
  jpFontBytes = await res.arrayBuffer();
  return jpFontBytes;
}

savePdfBtn.onclick = async () => {
  if (!loadedPdfBytes) return;
  const pdfDocLib = await PDFLib.PDFDocument.load(loadedPdfBytes);
  pdfDocLib.registerFontkit(fontkit);(loadedPdfBytes);
  pdfDocLib.registerFontkit(fontkit);
  const pages = pdfDocLib.getPages();

  // Embed fonts (use standard font)
  let font; try{ const bytes = await loadJpFont(); font = await pdfDocLib.embedFont(bytes); }catch(e){ font = await pdfDocLib.embedFont(PDFLib.StandardFonts.Helvetica); }

  // Add small photo thumbnails if present (optional)
  for (const p of points) {
    if (p.mode !== 'pdf') continue;
    const pageIdx = Math.min(Math.max(1, p.page), pages.length) - 1;
    const page = pages[pageIdx];

    // p.x,p.y are CSS coords; need to map to PDF user space:
    // When we rendered with viewport scale and dpr, CSS coords match viewport CSS size.
    // We need to compute ratio from css to pdf points.
    // pdfCanvas.getBoundingClientRect() represents current page CSS size at current scale.
    // But saved PDF pages might have different sizes; we must recompute using current render viewport:
    const pageObj = await pdfDoc.getPage(p.page);
    const viewport = pageObj.getViewport({ scale: pdfScale });
    const cssW = viewport.width;
    const cssH = viewport.height;

    const pdfW = page.getWidth();
    const pdfH = page.getHeight();

    const xPdf = (p.x / cssW) * pdfW;
    const yPdfFromTop = (p.y / cssH) * pdfH;
    const yPdf = pdfH - yPdfFromTop;

    const label = `${p.id} 差:${p.diff != null ? p.diff : '-'}lx (点${p.onLux??'-'}-消${p.offLux??'-'})`;
    page.drawText(label, {
      x: xPdf + 8,
      y: yPdf,
      size: 10,
      font,
      color: PDFLib.rgb(1, 1, 0)
    });

    // optional small circle-like rectangle marker
    page.drawEllipse({
      x: xPdf, y: yPdf + 4,
      xScale: 6, yScale: 6,
      color: PDFLib.rgb(1, 0, 0)
    });

    if (p.photo) {
      try {
        const jpgBytes = dataURLtoUint8Array(p.photo);
        const jpgImg = await pdfDocLib.embedJpg(jpgBytes);
        const imgW = 60, imgH = (jpgImg.height / jpgImg.width) * imgW;
        page.drawImage(jpgImg, {
          x: xPdf + 8,
          y: yPdf - imgH - 6,
          width: imgW,
          height: imgH,
          opacity: 0.9
        });
      } catch (e) { console.warn('photo embed failed', e); }
    }

    if (p.comment) {
      page.drawText(`Note: ${p.comment}`, {
        x: xPdf + 8,
        y: yPdf - 80,
        size: 9,
        font,
        color: PDFLib.rgb(1, 1, 1),
        maxWidth: 200,
        lineHeight: 10
      });
    }
  }

  // Header text
  const headerFont = font;
  for (let i = 0; i < pages.length; i++) {
    const page = pages[i];
    page.drawText(`現場: ${siteName.value || ''} / 部屋: ${roomName.value || ''}`, {
      x: 36,
      y: page.getHeight() - 24,
      size: 10,
      font: headerFont,
      color: PDFLib.rgb(0.04, 0.52, 1.0)
    });
    page.drawText(`作成: ${now()}`, {
      x: 36,
      y: page.getHeight() - 36,
      size: 9,
      font: font,
      color: PDFLib.rgb(0.8, 0.8, 0.8)
    });
  }

  const pdfBytes = await pdfDocLib.save();
  const blob = new Blob([pdfBytes], { type: 'application/pdf' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `completed_measurement_${formatDateForFile(new Date())}.pdf`;
  a.click();
};

/* Helpers */
function dataURLtoUint8Array(dataURL) {
  const base64 = dataURL.split(',')[1] || '';
  const bin = atob(base64);
  const len = bin.length;
  const bytes = new Uint8Array(len);
  for (let i=0;i<len;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

let dragTarget = null;
let dragOffset = {x:0,y:0};

function findNearestPoint(x, y, mode, page, threshold=30) {
  let nearest = null;
  let minDist = threshold;
  points.forEach(p => {
    if (p.mode !== mode) return;
    if (mode === 'pdf' && p.page !== page) return;
    const dx = (p.x||0) - x;
    const dy = (p.y||0) - y;
    const d = Math.hypot(dx, dy);
    if (d < minDist) { minDist = d; nearest = p; }
  });
  return nearest;
}

 );
 self.skipWaiting();

}

window.addEventListener('deviceorientation', e=>{
  if(!arBase) arBase = {a:e.alpha, b:e.beta, g:e.gamma};
  const db = (e.beta - arBase.b)||0;
  const dg = (e.gamma - arBase.g)||0;
  // 簡易補正: 画面を少し平行移動
  const shiftX = dg*2, shiftY = db*2;
  canvas.style.transform = `translate(${shiftX}px,${shiftY}px)`;
});
