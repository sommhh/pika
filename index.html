<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LuxAR Pro MAX</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a84ff">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<video id="camera" autoplay playsinline></video>
<canvas id="overlay"></canvas>

<div id="ui">
  <h2>LuxAR Pro MAX</h2>

  <div class="row">
    <input id="siteName" placeholder="現場名">
    <input id="roomName" placeholder="部屋名">
  </div>

  <div class="row">
    <button id="addBtn">測定点追加</button>
    <button id="exportBtn">CSV出力</button>
  </div>

  <div class="row">
    <input id="offLux" type="number" placeholder="消灯lx">
    <input id="onLux" type="number" placeholder="点灯lx">
  </div>

  <div id="points"></div>
</div>

<script src="app.js"></script>
</body>
</html>
